name: Submit a Logo
description: Add your recreation of a GTA brand logo to Grand Theft Brands.
title: "[Submission] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing! Once you submit, a bot checks your file and posts a preview here within a minute or two. A maintainer then reviews it, and you'll be credited on the site with your GitHub account.

        **File requirements:** an **SVG** (preferred) or a **PNG at least 1024px** on its longest side, with a transparent background. If GitHub won't accept your SVG, zip it and attach the .zip.
  - type: input
    id: brand
    attributes:
      label: Brand Name
      description: The brand as it appears in the game.
      placeholder: Vice City Manatees
    validations:
      required: true
  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - GTA VI
        - GTA V
        - GTA IV
        - GTA III
        - GTA SA
        - GTA VC
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Pick "Game Logos" for the games' own logos, like the GTA V logo or The Ballad of Gay Tony.
      options:
        - Game Logos
        - Business
        - Food
        - Apps & Web
        - Radio
        - Vehicles
        - Locations
        - Weapons
        - Sports
        - Media, TV & Film
        - Fashion & Clothing
        - Government
        - Emergency Services
        - Gangs & Organisations
    validations:
      required: true
  - type: dropdown
    id: variant
    attributes:
      label: Logo Type
      description: Which version of the brand's logo is this?
      options:
        - Primary Logo
        - Icon
        - Wordmark
        - Text Lockup
        - Horizontal Lockup
        - Vertical Lockup
        - Badge / Emblem
        - Other
    validations:
      required: true
  - type: dropdown
    id: lore
    attributes:
      label: Canon or Fanon
      description: "Canon: the logo appears in the game. Fanon: fan-made, or inspired by the game but not in it."
      options:
        - Canon
        - Fanon
    validations:
      required: true
  - type: input
    id: variant-other
    attributes:
      label: Logo Name (Optional)
      description: Required for Other. Otherwise optional, to tell this logo apart if the brand has more than one of this type (e.g. "Alternate" or "1990s"). Left blank, a second Icon is called "Icon 2".
      placeholder: Alternate
  - type: textarea
    id: logo
    attributes:
      label: Logo File
      description: Drag your SVG, PNG or .zip into this box.
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Extra Files (Optional)
      description: Animated GIF or MP4 versions, or an EPS. Attach them here.
  - type: textarea
    id: brand-description
    attributes:
      label: Brand Description (Optional)
      description: One or two sentences about the brand for its page on the site, such as what it is and where it appears in the game. Only used the first time a brand is added.
      placeholder: Vice City's professional basketball team, seen on billboards around Leonida.
  - type: textarea
    id: notes
    attributes:
      label: Notes (Optional)
      description: Anything the reviewer should know, such as reference screenshots from the game.
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm
      options:
        - label: I recreated this logo myself.
          required: true
        - label: I did not use AI to create any part of it.
          required: true
        - label: I agree that it can be shared for free on Grand Theft Brands under the site's terms.
          required: true
